services:
  api:
    build:
      context: .
      dockerfile: Containerfile
      target: api
    ports:
      - "8000:8000"
    environment:
      ATHANOR_APP_NAME: AthanorIDE API
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Containerfile
      target: web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
    depends_on:
      api:
        condition: service_healthy
