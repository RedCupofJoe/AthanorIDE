apiVersion: apps/v1
kind: Deployment
metadata:
  name: athanoride
  namespace: athanoride
  labels:
    app.kubernetes.io/name: athanoride
    app.kubernetes.io/part-of: athanor-ide
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: athanoride
  template:
    metadata:
      labels:
        app.kubernetes.io/name: athanoride
        app.kubernetes.io/part-of: athanor-ide
    spec:
      serviceAccountName: athanoride-auth
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: oauth-proxy-cookie
          secret:
            secretName: athanoride-oauth
            defaultMode: 0440
            items:
              - key: cookie-secret
                path: cookie-secret
        - name: oauth-proxy-service-account
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
      containers:
        - name: web
          image: athanoride-web:latest
          imagePullPolicy: IfNotPresent
          workingDir: /repo/apps/web
          command: ["node", "node_modules/next/dist/bin/next"]
          args: ["start", "--hostname", "0.0.0.0", "--port", "3000"]
          env:
            - name: HOME
              value: /tmp
            - name: PORT
              value: "3000"
          ports:
            - name: web
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: web
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: web
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
        - name: api
          image: athanoride-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: api
              containerPort: 8000
              protocol: TCP
          env:
            - name: ATHANOR_APP_NAME
              value: AthanorIDE API
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: api
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
        - name: oauth-proxy
          image: athanoride-oauth-proxy:4.20
          imagePullPolicy: IfNotPresent
          args:
            - --provider=openshift
            - --openshift-service-account=athanoride-auth
            - --openshift-sar={"namespace":"athanoride","resource":"services","resourceName":"athanoride","verb":"get"}
            - --upstream=http://127.0.0.1:3000/
            - --http-address=:4180
            - --https-address=
            - --cookie-secret-file=/etc/oauth-proxy/cookie-secret
            - --cookie-secure=true
            - --request-logging=true
          ports:
            - name: proxy
              containerPort: 4180
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /oauth/healthz
              port: proxy
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /oauth/healthz
              port: proxy
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: oauth-proxy-cookie
              mountPath: /etc/oauth-proxy
              readOnly: true
            - name: oauth-proxy-service-account
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
