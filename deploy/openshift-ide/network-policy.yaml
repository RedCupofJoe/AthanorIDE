apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: athanoride
  namespace: athanoride
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: athanoride
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        - protocol: TCP
          port: 4180
  # Allow egress. OVN does not match the Kubernetes ClusterIP (172.30.0.1:443)
  # with an ipBlock or host-network selector, so a port-limited rule leaves the
  # OAuth proxy unable to reach the API and the Route returns 403.
  egress:
    - {}
