# Deploy AthanorIDE itself as a web/API/OAuth-proxy pod on OpenShift 4.20+.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: athanoride
resources:
  - namespace.yaml
  - service-account.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - network-policy.yaml
images:
  - name: athanoride-web
    newName: image-registry.openshift-image-registry.svc:5000/athanoride/athanoride-web
    newTag: latest
  - name: athanoride-api
    newName: image-registry.openshift-image-registry.svc:5000/athanoride/athanoride-api
    newTag: latest
  - name: athanoride-oauth-proxy
    newName: quay.io/openshift/origin-oauth-proxy
    newTag: "4.20"
